name: cuelink_config
description: "Authenticated Bluetooth configuration companion for CueLink Controller."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_reactive_ble: 5.6.0
  package_info_plus: ^10.2.2
  url_launcher: ^6.3.3

dev_dependencies:
  fake_async: 1.3.3
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  url_launcher_platform_interface: ^2.3.2

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/licenses/
